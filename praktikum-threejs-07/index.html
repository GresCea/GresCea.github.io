<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Interactive 3D Application</title>

  <!-- Import CSS -->
  <link rel="stylesheet" href="./src/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <aside id="hud">
      <h1>Interactive 3D Prototype</h1>
      <div>Hover: <span id="hoverInfo">-</span></div>
      <div>Selected: <span id="selectedInfo">-</span></div>
      <div>Animation: <span id="animationInfo">-</span></div>
      <div>Loading: <span id="loadingInfo">ready</span></div>
      <div>Environment: <span id="envState">ON</span></div>
      
      <!-- Challenge C: Information Panel -->
      <div>
        <br><strong>Details:</strong><br>
        <span id="detailsInfo">-</span>
      </div>
      
      <br>
      <div style="font-size: 0.85em; opacity: 0.8;">
        <div>Drag = Orbit | Scroll = Zoom | Right drag = Pan</div>
        <div>Space = Pause | R = Reset | E = Environment</div>
        <div>1, 2, 3 = Switch Animation Clip</div>
      </div>
    </aside>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
